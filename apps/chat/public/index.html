<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laya 判断チャット</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Laya 判断チャット <span class="tag">dev</span></h1>
    <div class="status" id="status" title="laya/status">確認中…</div>
  </header>

  <main class="layout">
    <section class="chat">
      <div class="log" id="log" aria-live="polite">
        <p class="empty" id="empty">右の欄で質問を決め、下の入力欄に判断させたい文章（state）を書いて送信します。</p>
      </div>
      <form class="composer" id="composer">
        <textarea id="state" rows="3" placeholder="判断対象の文章（state）。JSON を書くと JSON として送ります。Ctrl+Enter で送信" required></textarea>
        <button type="submit" id="send">送信</button>
      </form>
    </section>

    <aside class="panel">
      <div class="field">
        <label for="model">モデル</label>
        <select id="model"></select>
      </div>

      <div class="panel-head">
        <h2>質問</h2>
        <div class="row">
          <button type="button" class="ghost" data-add="noul">＋ noul</button>
          <button type="button" class="ghost" data-add="choice">＋ choice</button>
          <button type="button" class="ghost" data-add="score">＋ score</button>
        </div>
      </div>
      <div id="questions"></div>

      <details class="meta">
        <summary>メタデータ（任意）</summary>
        <div class="field"><label for="session">session_id</label><input id="session" maxlength="256"></div>
        <div class="field"><label for="user">user</label><input id="user" maxlength="256"></div>
      </details>
      <button type="button" class="ghost small" id="reset">質問を初期状態に戻す</button>
    </aside>
  </main>

  <template id="q-template">
    <div class="question">
      <div class="q-row">
        <input class="q-id" placeholder="質問ID" maxlength="64" pattern="[A-Za-z0-9_.\-]+" required>
        <span class="q-type"></span>
        <button type="button" class="icon q-remove" title="削除">×</button>
      </div>
      <textarea class="q-instructions" rows="2" placeholder="instructions（何を判断させるか）" required></textarea>
      <textarea class="q-criteria" rows="3"></textarea>
      <p class="hint q-hint"></p>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
